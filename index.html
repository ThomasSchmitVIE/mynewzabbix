<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13233c"><title>Printbox Network Status</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"><link rel="stylesheet" href="styles.css"></head><body>
<section id="login" class="login"><form id="loginForm" class="login-card"><span class="eyebrow">PRINTBOX MONITORING</span><h1>Network Status</h1><label>Benutzername<input id="username" required autocomplete="username"></label><label>Passwort<input id="password" type="password" required autocomplete="current-password"></label><button>Anmelden</button><p id="loginError"></p></form></section>
<div id="app" hidden><header><div><span class="eyebrow">PRINTBOX NETWORK</span><h1>Status Dashboard</h1><p>Aktive Probleme im österreichischen Netzwerk</p></div><div class="header-actions"><span id="liveState" class="live">● LIVE</span><button id="logout" class="ghost">Abmelden</button></div></header>
<main><section id="summary" class="summary"></section><section class="filters"><label class="search">Standort oder Problem suchen<input id="search" type="search" placeholder="z. B. GEISEL, Toner oder Papier"></label><label>Gebiet<select id="area"><option value="all">Alle Gebiete</option><option value="vienna">Wien</option><option value="graz">Graz</option><option value="linz">Linz</option><option value="rest">Rest</option></select></label><label>Schweregrad<select id="severity"><option value="all">Alle</option><option value="5">Katastrophe</option><option value="4">Hoch</option><option value="3">Durchschnitt</option><option value="2">Warnung</option><option value="1">Information</option></select></label><label>Problemtyp<select id="category"><option value="all">Alle Typen</option></select></label><button id="refresh" class="refresh">Jetzt aktualisieren</button></section><div class="result-row"><div class="result-bar"><span id="resultCount"></span><span id="updated"></span></div><div class="view-switch" aria-label="Ansicht wählen"><button id="listView" type="button" class="active" aria-pressed="true">☰ Liste</button><button id="mapView" type="button" aria-pressed="false">⌖ Karte</button></div></div><section id="locations" class="locations"></section><section id="mapPanel" class="map-panel" hidden><div id="problemMap" aria-label="Karte der Problemstandorte"></div><div id="mapNote" class="map-note"></div></section><section id="status" class="status" aria-live="polite"></section></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script src="app.js"></script></body></html>
